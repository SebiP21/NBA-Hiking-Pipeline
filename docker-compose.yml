# Note: The 'version' tag is obsolete, so we omit it.
services:
  postgres:
    image: postgres:13
    container_name: postgres
    ports:                
      - "5432:5432"
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow

  mongo:
    image: mongo:5.0
    container_name: mongo
    ports:
      - "27017:27017"

  neo4j:
    image: neo4j:4.4
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt

  airflow-webserver:
    build:
      context: ./docker/airflow
    container_name: airflow_webserver
    depends_on:
      - postgres
      - mongo
      - neo4j
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=${AIRFLOW_UID}
      - MONGO_HOST=mongo
      - NEO4J_HOST=neo4j
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgres://airflow:airflow@postgres:5432/airflow
      # --- Windows-safe log filenames (avoid ":" etc.) ---
      - AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE={{ ti.dag_id }}/{{ ti.task_id }}/{{ ts_nodash }}/{{ try_number }}.log
      - AIRFLOW__LOGGING__FILENAME_TEMPLATE={{ ti.dag_id }}/{{ ti.task_id }}/{{ ts_nodash }}/{{ try_number }}.log
      - AIRFLOW__LOGGING__LOG_PROCESSOR_FILENAME_TEMPLATE={{ filename }}.log
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data                # contains /raw and /gold
      - ./logs:/opt/airflow/logs
      - ./SQL:/opt/airflow/sql                  # <-- add your .sql files here
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: ./docker/airflow
    container_name: airflow_scheduler
    depends_on:
      - airflow-webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./SQL:/opt/airflow/sql                  # <-- same SQL mount
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=${AIRFLOW_UID}
      - MONGO_HOST=mongo
      - NEO4J_HOST=neo4j
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgres://airflow:airflow@postgres:5432/airflow
      # --- Windows-safe log filenames (avoid ":" etc.) ---
      - AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE={{ ti.dag_id }}/{{ ti.task_id }}/{{ ts_nodash }}/{{ try_number }}.log
      - AIRFLOW__LOGGING__FILENAME_TEMPLATE={{ ti.dag_id }}/{{ ti.task_id }}/{{ ts_nodash }}/{{ try_number }}.log
      - AIRFLOW__LOGGING__LOG_PROCESSOR_FILENAME_TEMPLATE={{ filename }}.log
    command: scheduler

  airflow-init:
    build:
      context: ./docker/airflow
    container_name: airflow_init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_UID=${AIRFLOW_UID}
    command: >
      bash -c "airflow db init && airflow users create --username admin --password admin --firstname Anonymous --lastname User --role Admin --email admin@example.org"
